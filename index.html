<header class="site-head" id="siteHead">

    <nav class="nav" id="mainNav" aria-label="Основная навигация"></nav>

    <div class="head-actions">
      <!-- Кнопка «my social networks» → linktr.ee -->
      <a class="btn btn-social" id="socialButton" href="https://linktr.ee/IDTH" target="_blank" rel="noopener noreferrer me">
        <span class="pulse" aria-hidden="true"></span>
        <span class="btn-label">my social networks</span>
        <svg class="btn-arrow" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
          <path d="M7 17 17 7M9 7h8v8" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="square"/>
        </svg>
      </a>
      <button class="burger" id="burger" type="button" aria-expanded="false" aria-controls="mobileNav" aria-label="Меню">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>

  <div class="mobile-nav" id="mobileNav" hidden>
    <div class="mobile-nav-inner">
      <nav id="mobileNavLinks" aria-label="Мобильная навигация"></nav>
      <a class="btn btn-social btn-block" id="socialButtonMobile" href="https://linktr.ee/IDTH" target="_blank" rel="noopener noreferrer me">
        <span class="btn-label">my social networks</span>
        <svg class="btn-arrow" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8" fill="none" stroke="currentColor" stroke-width="2.1"/></svg>
      </a>
    </div>
  </div>
</header>

<main id="main">
  <!-- ═══════════════════════════ HERO ═══════════════════════════ -->
  <section class="hero" id="top">
    <div class="hero-bg" aria-hidden="true">
      <img id="heroImage" src="assets/hero.jpg" alt="">
      <div class="hero-scrim"></div>
      <div class="hero-scan"></div>
    </div>

    <div class="hero-inner">
      <p class="hero-eyebrow" id="heroEyebrow">LIVE A/V · TECHNO · INDUSTRIAL</p>
      <h1 class="hero-title" id="heroTitle">IDTH</h1>
      <p class="hero-sub" id="heroSub"></p>
      <div class="hero-cta" id="heroCta"></div>
    </div>

    <div class="marquee" id="marquee" aria-hidden="true">
      <div class="marquee-track" id="marqueeTrack"></div>
    </div>
    <div class="hero-scroll" aria-hidden="true"><span></span>SCROLL</div>
  </section>

  <!-- ═══════════════════════════ ЛЕНТА / RELEASES ═══════════════════════════ -->
  <section class="band" id="releases" data-section="releases">
    <header class="band-head">
      <span class="band-num">01</span>
      <h2 class="band-title" data-title>Лента и релизы</h2>
      <span class="band-rule" aria-hidden="true"></span>
      <span class="band-count" id="feedCount"></span>
    </header>
    <div class="feed" id="feed"></div>
  </section>

  <!-- ═══════════════════════════ ССЫЛКИ ═══════════════════════════ -->
  <section class="band band-alt" id="links" data-section="links">

      <span class="band-num">02</span>
      <h2 class="band-title" data-title>Слушать и следить</h2>
      <span class="band-rule" aria-hidden="true"></span>
      <a class="band-more" id="linktreeTop" href="https://linktr.ee/IDTH" target="_blank" rel="noopener noreferrer">
        Все ссылки на linktr.ee
        <svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      </a>
    </header>
    <div class="links" id="linksGrid"></div>
  </section>

  <!-- ═══════════════════════════ О ПРОЕКТЕ ═══════════════════════════ -->
  <section class="band" id="about" data-section="about">
    <header class="band-head">
      <span class="band-num">03</span>
      <h2 class="band-title" data-title>О проекте</h2>
      <span class="band-rule" aria-hidden="true"></span>
    </header>
    <div class="about">
      <div class="about-media">
        <figure class="frame">
          <img id="aboutImage" src="assets/portrait.jpg" alt="IDTH — портрет">
          <figcaption id="aboutCaption"></figcaption>
        </figure>
      </div>
      <div class="about-body">
        <div class="about-text" id="aboutText"></div>
        <ul class="stats" id="stats"></ul>
      </div>
    </div>
  </section>

  <!-- ═══════════════════════════ БУКИНГ ═══════════════════════════ -->
  <section class="band band-booking" id="booking" data-section="booking">
    <header class="band-head">
      <span class="band-num">04</span>
      <h2 class="band-title" data-title>Букинг и связь</h2>
      <span class="band-rule" aria-hidden="true"></span>
    </header>
    <div class="booking">
      <div class="booking-info">
        <p class="booking-lead" id="bookingText"></p>
        <dl class="booking-dl" id="bookingDl"></dl>
        <p class="booking-notes" id="bookingNotes"></p>
      </div>

      <form class="booking-form" id="bookingForm" novalidate>
        <h3>Заявка</h3>
        <div class="field">
          <label for="f-name">Имя / площадка</label>
          <input id="f-name" name="name" type="text" autocomplete="name" placeholder="Klub X" required>
        </div>
        <div class="field">
          <label for="f-email">E-mail</label>
          <input id="f-email" name="email" type="email" autocomplete="email" placeholder="you@club.com" required>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="f-city">Город</label>
            <input id="f-city" name="city" type="text" placeholder="Rotterdam">
          </div>
          <div class="field">
            <label for="f-date">Дата</label>
            <input id="f-date" name="date" type="date">
          </div>
        </div>
        <div class="field">
          <label for="f-message">Сообщение</label>
          <textarea id="f-message" name="message" rows="4" placeholder="Формат, тайминг, бюджет, зал…" required></textarea>
        </div>
        <div class="form-foot">
          <button class="btn btn-solid" type="submit" id="bookingSubmit">Отправить</button>
          <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
        </div>
      </form>
    </div>
  </section>
</main>
